@let item = flower();
@let quantity = cart.quantity(item.id);
<article class="flower-card">
  <div class="card-image">
    <a [routerLink]="['/flower', item.id]" tabindex="-1" aria-hidden="true">
      <img [src]="item.imageUrl" alt="" width="880" height="880" [loading]="loading()" decoding="async">
    </a>
    <button class="icon-button favorite-button" type="button"
      [attr.aria-label]="'Preferito, ' + item.name" [attr.aria-pressed]="favorites.isFavorite(item)"
      (click)="favorites.toggle(item)">
      <app-icon name="heart" />
    </button>
  </div>
  <div class="card-body">
    <div>
      <h3><a [routerLink]="['/flower', item.id]">{{ item.name }}</a></h3>
      <p class="card-caption">{{ item.composition || 'Fiore singolo' }}</p>
    </div>
    <div class="card-actions">
      <p class="card-price">{{ item.price | currency:'EUR' }} <small>/ {{ item.kind === 'bouquet' ? 'bouquet' : 'stelo' }}</small></p>
      <button class="icon-button add-button" type="button" title="Aggiungi al carrello"
        [attr.aria-label]="'Aggiungi ' + item.name + ' al carrello'" (click)="cart.add(item.id)">
        <app-icon name="plus" />
        @if (quantity) {
          <span class="item-count" aria-hidden="true">{{ quantity > 99 ? '99+' : quantity }}</span>
        }
      </button>
    </div>
  </div>
</article>
