<form class="flower-search" role="search" (submit)="$event.preventDefault(); searchFlowers(searchInput.value)">
  <input
    #searchInput
    type="search"
    aria-label="Cerca un fiore per nome"
    placeholder="Cerca un fiore"
    (input)="clearSearchWhenEmpty(searchInput.value)"
  />
  <button type="submit">Cerca</button>
</form>

<p class="search-status" role="status">
  @if (visibleFlowers().length === 0) {
    Nessun fiore trovato.
  }
</p>

<ul>
  <li *ngFor="let flower of visibleFlowers()">
    <a routerLink="/flower/{{flower.id}}">
      <img [src]="flower.imageUrl" [alt]="flower.name" />

      <div class="content">
        <div class="name">
          {{ flower.name }}
        </div>

        <div
          class="stars"
          role="img"
          [attr.aria-label]="flower.stars + ' out of 5 stars'"
          [style.--rating]="flower.stars"
        >
          <span aria-hidden="true">★★★★★</span>
          <span class="stars-fill" aria-hidden="true">★★★★★</span>
        </div>

        <div class="product-item-footer">
          <div class="origins">
            <span *ngFor="let origin of flower.origins">
              {{ origin }}
            </span>
          </div>

          @if (flower.deliveryTime; as deliveryTime) {
            <div class="delivery-time">
              <span aria-hidden="true">🕒</span>
              Consegna in {{ deliveryTime }}
            </div>
          }
        </div>

        <div class="price">
          <span>{{ flower.price | currency:'EUR' }}</span>
        </div>
      </div>
    </a>
    <button
      type="button"
      class="favorite"
      [attr.aria-label]="'Mi piace per ' + flower.name"
      [attr.aria-pressed]="flower.favorite"
      (click)="toggleFavorite(flower)"
    >
      <span aria-hidden="true">{{ flower.favorite ? '♥' : '♡' }}</span>
    </button>
  </li>
</ul>
